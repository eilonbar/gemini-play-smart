[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "play-smart"
version = "0.1.0"
description = "A 429-survival ladder for the Gemini Agent Platform: when a request is throttled, fail sideways across lanes, models and endpoints instead of retrying in place. No reserved capacity required."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "gemini",
    "gemini-agent-platform",
    "google-cloud",
    "resilience",
    "retry",
    "429",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 1.69.0 is the first release that derives the multi-region REP base URL from
# location="us"/"eu". Earlier versions fall through to the single-region
# concatenation and build us-aiplatform.googleapis.com, a host that does not
# exist, so the multi_region steps fail with a non-retryable 400 that looks
# like a bug in this package. See play_smart/ladder.py:_client.
dependencies = ["google-genai>=1.69.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/eilonbar/gemini-play-smart"
Issues = "https://github.com/eilonbar/gemini-play-smart/issues"

[tool.hatch.build.targets.wheel]
packages = ["play_smart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits the real Gemini Agent Platform API (requires ADC and a project)",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"demo/*" = ["E402"]
